name: clang-format-check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run clang-format style check for C/C++/Protobuf programs.
        uses: jidicula/clang-format-action@v4.18.0
        with:
          # The whole repository (benchmark, include and test hold the C++ files)
          check-path: "."
          # The default of the action, with the C++ module interface units (.cppm)
          include-regex: '^.*\.((((c|C)(c|pp|xx|\+\+)?$)|((h|H)h?(pp|xx|\+\+)?$))|(cppm|ino|pde|proto|cu))$'
          fallback-style: "Google"
          clang-format-version: '22'
