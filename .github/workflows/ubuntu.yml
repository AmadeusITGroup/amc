name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci_test_gcc_release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # C++20 by default, C++17 for the compilers whose C++20 mode is pre-standard (__cplusplus 201709L)
        include:
          - { compiler: g++-9, standard: 17 }
          - { compiler: g++-11, standard: 20 }
          - { compiler: g++-13, standard: 20 }
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          echo "deb http://dk.archive.ubuntu.com/ubuntu/ focal main universe" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_test_gcc_debug:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { compiler: g++-8, standard: 17 }
          - { compiler: g++-10, standard: 17 }
          - { compiler: g++-12, standard: 20 }
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          echo "deb http://dk.archive.ubuntu.com/ubuntu/ focal main universe" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_ASAN=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_test_clang_release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: ["17", "19"]
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          wget --retry-connrefused --waitretry=5 --tries=5 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler }}
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DAMC_ENABLE_ASAN=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_test_clang_debug:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: ["20"]
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler }}
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_ASAN=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_test_standards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        standard: [14, 17, 20, 23]
        compiler: [g++-13]
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_ASAN=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  # C++20 module (CMake 3.28, Ninja, a compiler scanning module dependencies: Clang with clang-scan-deps, GCC 14 or
  # later). With GCC, the module and its test are built without the undefined behavior sanitizer (see
  # SetProjectProperties.cmake)
  ci_module:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, compiler: clang++-21, llvm: "21", standard: 23, nonstd: "ON" }
          - { os: ubuntu-latest, compiler: clang++-19, llvm: "19", standard: 20, nonstd: "OFF" }
          - { os: ubuntu-26.04, compiler: g++-15, standard: 23, nonstd: "ON" }  # GCC 15 is not in Ubuntu 24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ -n "${{ matrix.llvm }}" ]; then
            wget --retry-connrefused --waitretry=5 --tries=5 https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh ${{ matrix.llvm }}
            sudo apt-get install -y clang-tools-${{ matrix.llvm }}
          else
            sudo apt-get install -y ${{ matrix.compiler }}
          fi
          # apt takes a missing package name as a regular expression ('+' in 'g++-15'), and installs what matches it
          ${{ matrix.compiler }} --version
      - name: cmake
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_MODULE=ON -DAMC_MODULE_NONSTD_FEATURES=${{ matrix.nonstd }} -DAMC_ENABLE_ASAN=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_nonstandard_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DAMC_PEDANTIC=ON -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_ASAN=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: cd build && ctest -j --output-on-failure

  ci_coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload with OIDC, no CODECOV_TOKEN secret needed (tokenless for pull requests from forks)
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        run: |
          wget --retry-connrefused --waitretry=5 --tries=5 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21
      - name: cmake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_BUILD_TYPE=Debug -DAMC_ENABLE_COVERAGE=ON -DAMC_WARNINGS_AS_ERRORS=ON
      - name: build, test and report coverage
        run: cmake --build build --target coverage --parallel
      - name: summary
        run: |
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat build/coverage/report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/amc.lcov
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false # a Codecov outage should not fail the CI
      - name: archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage/html
            build/coverage/amc.lcov

  # Sanity check of benchmark/run_benchmarks.py with a single compiler: builds the benchmarks, runs each of them once,
  # shortly, and imports the results into docs/. The times of a shared runner mean nothing: the job only checks that it
  # all works, from the builds to the charts and tables
  ci_benchmark_script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: run the benchmarks
        run: python3 benchmark/run_benchmarks.py --cxx g++ --repetitions 1 --min-time 0.01
      - name: check the import
        run: |
          git status --short docs
          test -n "$(git status --porcelain docs/benchmarks)" || { echo "the import did not update docs/benchmarks"; exit 1; }
