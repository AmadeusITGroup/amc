<svg xmlns="http://www.w3.org/2000/svg" width="880" height="988" viewBox="0 0 880 988" role="img" aria-labelledby="title desc">
<title id="title">amc::SmallVector&lt;T, 16&gt; vs std::vector</title>
<desc id="desc">Time to fill, read and destroy std::vector, amc::vector and amc::SmallVector, from all small to all large.</desc>
<style>
:root { --bg: #f6f8fa; --ink: #1f2328; --ink2: #59636e; --grid: #e1e4e8; --axis: #c8d1da;
        --s-ref: #eb6834; --s-uno: #1baf7a; --s-amc: #2a78d6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161b22; --ink: #f0f6fc; --ink2: #9198a1; --grid: #262c36; --axis: #3d444d;
          --s-ref: #d95926; --s-uno: #199e70; --s-amc: #3987e5; }
}
text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
.bg { fill: var(--bg); }
.title { font-size: 18px; font-weight: 600; }
.subtitle { font-size: 13px; fill: var(--ink2); }
.panel { font-size: 13px; font-weight: 600; }
.label { font-size: 13px; }
.tick { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
.ratio { font-size: 13px; font-variant-numeric: tabular-nums; }
.ratio tspan.word { fill: var(--ink2); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.link { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
.dot { stroke: var(--bg); stroke-width: 1.5; }
.ring { fill: var(--bg); stroke-width: 2.5; }
.ring.ref { stroke: var(--s-ref); } .ring.uno { stroke: var(--s-uno); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot.amc { fill: var(--s-amc); } .dot.amcv { fill: var(--s-uno); }
.line.ref { stroke: var(--s-ref); fill: none; } .line.uno { stroke: var(--s-uno); fill: none; }
.line.amc { stroke: var(--s-amc); fill: none; }
</style>
<rect class="bg" width="880" height="988" rx="12"/>
<text x="28.0" y="44.0" class="title" text-anchor="start">amc::SmallVector&lt;T, 16&gt; vs std::vector</text>
<text x="28.0" y="66.0" class="subtitle" text-anchor="start">A vector is filled by emplace_back, read and destroyed. Small vectors have 1 to 16 elements, large ones 17 to 64.</text>
<text x="28.0" y="84.0" class="subtitle" text-anchor="start">Time per vector, log scale - lower is better · GCC 13 · AMD Ryzen AI 9 HX PRO 370 (L2 1 MiB, L3 16 MiB)</text>
<circle cx="34.0" cy="110.0" r="5.5" class="ring ref"/>
<text x="46.0" y="114.0" class="label" text-anchor="start">std::vector</text>
<circle cx="166.2" cy="110.0" r="4.5" class="dot amcv"/>
<text x="178.2" y="114.0" class="label" text-anchor="start">amc::vector</text>
<circle cx="298.4" cy="110.0" r="4.5" class="dot amc"/>
<text x="310.4" y="114.0" class="label" text-anchor="start">amc::SmallVector&lt;T, 16&gt;</text>
<text x="852.0" y="114.0" class="subtitle" text-anchor="end">SmallVector vs std::vector</text>
<text x="28.0" y="154.0" class="panel" text-anchor="start">Complex trivially relocatable type</text>
<line x1="266.0" y1="166.0" x2="266.0" y2="376.0" class="grid"/>
<text x="266.0" y="393.0" class="tick" text-anchor="middle">10 ns</text>
<line x1="495.0" y1="166.0" x2="495.0" y2="376.0" class="grid"/>
