<circle cx="399.7" cy="477.0" r="5.5" class="ring ref"/>
<circle cx="398.3" cy="477.0" r="4.5" class="dot amc"/>
<text x="852" y="481.5" class="ratio" text-anchor="end"><tspan class="word">same</tspan></text>
