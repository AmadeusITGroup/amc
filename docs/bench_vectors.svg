<line x1="297.0" y1="417.0" x2="303.2" y2="417.0" class="link"/>
<circle cx="297.0" cy="417.0" r="5.5" class="ring ref"/>
<circle cx="303.2" cy="417.0" r="4.5" class="dot amc"/>
<text x="852" y="421.5" class="ratio" text-anchor="end"><tspan font-weight="600">1.2×</tspan> <tspan class="word">slower</tspan></text>
