<line x1="617.6" y1="402.0" x2="617.6" y2="612.0" class="grid"/>
<text x="617.6" y="629.0" class="tick" text-anchor="middle">100 µs</text>
<line x1="699.4" y1="402.0" x2="699.4" y2="612.0" class="grid"/>
<text x="699.4" y="629.0" class="tick" text-anchor="middle">1 ms</text>
<line x1="258.0" y1="612.0" x2="732.0" y2="612.0" class="axis"/>
