<line x1="358.4" y1="537.0" x2="360.8" y2="537.0" class="link"/>
<circle cx="360.8" cy="537.0" r="5.5" class="ring ref"/>
<circle cx="358.4" cy="537.0" r="4.5" class="dot amc"/>
<text x="852" y="541.5" class="ratio" text-anchor="end"><tspan font-weight="600">1.1×</tspan> <tspan class="word">faster</tspan></text>
<text x="28.0" y="571.5" class="label" text-anchor="start">Insert a std::set range</text>
<line x1="489.9" y1="567.0" x2="490.9" y2="567.0" class="link"/>
<circle cx="490.9" cy="567.0" r="5.5" class="ring ref"/>
<circle cx="489.9" cy="567.0" r="4.5" class="dot amc"/>
<text x="852" y="571.5" class="ratio" text-anchor="end"><tspan class="word">same</tspan></text>
<text x="28.0" y="601.5" class="label" text-anchor="start">Grow to 1M by emplace_back</text>
<line x1="672.5" y1="597.0" x2="697.8" y2="597.0" class="link"/>
<circle cx="697.8" cy="597.0" r="5.5" class="ring ref"/>
<circle cx="672.5" cy="597.0" r="4.5" class="dot amc"/>
<text x="852" y="601.5" class="ratio" text-anchor="end"><tspan font-weight="600">2.1×</tspan> <tspan class="word">faster</tspan></text>
