<circle cx="391.7" cy="163.0" r="5.5" class="ring ref"/>
<circle cx="380.9" cy="163.0" r="4.5" class="dot amc"/>
<text x="852" y="167.5" class="ratio" text-anchor="end"><tspan font-weight="600">1.4×</tspan> <tspan class="word">faster</tspan></text>
<text x="28.0" y="197.5" class="label" text-anchor="start">Copy, erase all of 1 000</text>
<line x1="470.5" y1="193.0" x2="497.9" y2="193.0" class="link"/>
