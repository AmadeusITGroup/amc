<svg xmlns="http://www.w3.org/2000/svg" width="880" height="670" viewBox="0 0 880 670" role="img" aria-labelledby="title desc">
<title id="title">amc::FlatSet vs std::set and std::unordered_set</title>
<desc id="desc">Benchmark times of std::set, std::unordered_set and amc::FlatSet for several operations.</desc>
<style>
:root { --bg: #f6f8fa; --ink: #1f2328; --ink2: #59636e; --grid: #e1e4e8; --axis: #c8d1da;
        --s-ref: #eb6834; --s-uno: #1baf7a; --s-amc: #2a78d6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161b22; --ink: #f0f6fc; --ink2: #9198a1; --grid: #262c36; --axis: #3d444d;
          --s-ref: #d95926; --s-uno: #199e70; --s-amc: #3987e5; }
}
text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
.bg { fill: var(--bg); }
.title { font-size: 18px; font-weight: 600; }
.subtitle { font-size: 13px; fill: var(--ink2); }
.panel { font-size: 13px; font-weight: 600; }
.label { font-size: 13px; }
.tick { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
.ratio { font-size: 13px; font-variant-numeric: tabular-nums; }
.ratio tspan.word { fill: var(--ink2); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.link { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
.dot { stroke: var(--bg); stroke-width: 1.5; }
.ring { fill: var(--bg); stroke-width: 2.5; }
.ring.ref { stroke: var(--s-ref); } .ring.uno { stroke: var(--s-uno); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot.amc { fill: var(--s-amc); } .dot.amcv { fill: var(--s-uno); }
.line.ref { stroke: var(--s-ref); fill: none; } .line.uno { stroke: var(--s-uno); fill: none; }
.line.amc { stroke: var(--s-amc); fill: none; }
</style>
<rect class="bg" width="880" height="670" rx="12"/>
<text x="28.0" y="44.0" class="title" text-anchor="start">amc::FlatSet vs std::set and std::unordered_set</text>
<text x="28.0" y="66.0" class="subtitle" text-anchor="start">Time per benchmark iteration, log scale - lower is better · GCC 13 · AMD Ryzen AI 9 HX PRO 370 (L2 1 MiB, L3 16 MiB)</text>
<circle cx="34.0" cy="92.0" r="5.5" class="ring ref"/>
<text x="46.0" y="96.0" class="label" text-anchor="start">std::set</text>
<circle cx="141.6" cy="92.0" r="5.5" class="ring uno"/>
<text x="153.6" y="96.0" class="label" text-anchor="start">std::unordered_set</text>
<circle cx="331.2" cy="92.0" r="4.5" class="dot amc"/>
<text x="343.2" y="96.0" class="label" text-anchor="start">amc::FlatSet</text>
<text x="852.0" y="96.0" class="subtitle" text-anchor="end">amc vs std::set</text>
<text x="28.0" y="136.0" class="panel" text-anchor="start">Complex trivially relocatable type</text>
<line x1="266.0" y1="148.0" x2="266.0" y2="238.0" class="grid"/>
<text x="266.0" y="255.0" class="tick" text-anchor="middle">100 ns</text>
<line x1="342.3" y1="148.0" x2="342.3" y2="238.0" class="grid"/>
<text x="342.3" y="255.0" class="tick" text-anchor="middle">1 µs</text>
<line x1="418.7" y1="148.0" x2="418.7" y2="238.0" class="grid"/>
<text x="418.7" y="255.0" class="tick" text-anchor="middle">10 µs</text>
<line x1="495.0" y1="148.0" x2="495.0" y2="238.0" class="grid"/>
<text x="495.0" y="255.0" class="tick" text-anchor="middle">100 µs</text>
<line x1="571.3" y1="148.0" x2="571.3" y2="238.0" class="grid"/>
<text x="571.3" y="255.0" class="tick" text-anchor="middle">1 ms</text>
<line x1="647.7" y1="148.0" x2="647.7" y2="238.0" class="grid"/>
<text x="647.7" y="255.0" class="tick" text-anchor="middle">10 ms</text>
<line x1="724.0" y1="148.0" x2="724.0" y2="238.0" class="grid"/>
<text x="724.0" y="255.0" class="tick" text-anchor="middle">100 ms</text>
<line x1="258.0" y1="238.0" x2="732.0" y2="238.0" class="axis"/>
<text x="28.0" y="167.5" class="label" text-anchor="start">Insert 200 random values</text>
